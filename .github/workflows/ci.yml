name: CI

on:
  push:
    branches: [main, "feature/**", "bug/**", "bugfix/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q custom_components tests
      - name: Run tests
        run: >-
          python -m pytest -q
          --cov=custom_components.warmwasser_zirkulation
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

  frontend:
    name: Vue frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Collect frontend coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm run audit
      - name: Build Vue frontend
        working-directory: frontend
        run: npm run build

  security:
    name: Python security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install security tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[security]"
      - name: Run Bandit
        run: python -m bandit -r custom_components -ll
      - name: Audit Python dependencies
        # The local package is intentionally editable for the test install and is not published on PyPI.
        run: python -m pip_audit --skip-editable

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, frontend, security, hassfest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag matches integration version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/warmwasser_zirkulation/manifest.json", encoding="utf-8"))["version"])')"
          expected_tag="v${manifest_version}"
          test "${RELEASE_TAG}" = "${expected_tag}" || {
            echo "Tag ${RELEASE_TAG} stimmt nicht mit ${expected_tag} aus manifest.json überein."
            exit 1
          }
      - name: Extract changelog entry
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "Kein Changelog-Eintrag für Version ${version} gefunden."
            exit 1
          }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "${RELEASE_TAG}" --verify-tag --title "Warmwasser-Zirkulation ${RELEASE_TAG}" --notes-file release-notes.md

